name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      # gradlew lost its executable bit in the push train (push-files
      # creates files mode 100644). Restore it until the tree itself
      # carries 100755 (needs a git push from a real checkout).
      - name: Make wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew build --no-daemon
        shell: bash
